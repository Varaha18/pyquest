<!-- PyQuest: learn Python with a companion. Story mode (course path) + Survival mode (write real code). -->
<title>PyQuest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PyQuest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first column (560px) for menus and lessons; Survival widens to a two-pane quest | workspace on large screens. Fixed tab bar on main screens. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#13203A; --muted:#58677F; --line:#D3DBE6;
  --blue:#2B62A6; --blue-ink:#FFFFFF; --blue-soft:#DCE7F5;
  --sun:#F2C230; --sun-ink:#2B2200; --sun-soft:#FBEFC4;
  --good:#1C7F4F; --good-bg:#DAF1E3; --bad:#BA3434; --bad-bg:#F9E1DF;
  --cave:#1B2236; --cave-2:#252E47; --cave-ink:#EDE6D3; --cave-muted:#A9A390;
  --code-bg:#14213A; --code-fg:#E4ECF7; --code-line:#26365A;
  --hk:#F2C230; --hs:#8FD3A8; --hn:#F5A07E; --hc:#7D8DA8; --hb:#8CC2FF;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1727; --surface:#16233A; --surface-2:#1B2A44; --ink:#E6EDF8; --muted:#97A6BF; --line:#283A5A;
  --blue:#5B92D9; --blue-ink:#0B1424; --blue-soft:#1C3354;
  --sun:#F2C230; --sun-ink:#2B2200; --sun-soft:#3A3217;
  --good:#5BC98D; --good-bg:#14352A; --bad:#F07C72; --bad-bg:#3D1C1E;
  --cave:#121828; --cave-2:#1C2438; --cave-ink:#EDE6D3; --cave-muted:#A9A390;
  --code-bg:#0A1220; --code-fg:#E4ECF7; --code-line:#1E2C47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1727; --surface:#16233A; --surface-2:#1B2A44; --ink:#E6EDF8; --muted:#97A6BF; --line:#283A5A;
  --blue:#5B92D9; --blue-ink:#0B1424; --blue-soft:#1C3354;
  --sun:#F2C230; --sun-ink:#2B2200; --sun-soft:#3A3217;
  --good:#5BC98D; --good-bg:#14352A; --bad:#F07C72; --bad-bg:#3D1C1E;
  --cave:#121828; --cave-2:#1C2438; --cave-ink:#EDE6D3; --cave-muted:#A9A390;
  --code-bg:#0A1220; --code-fg:#E4ECF7; --code-line:#1E2C47; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-block:18px 40px}
#app.wide{max-width:1080px}
#app.withtabs{padding-bottom:110px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
code{font-family:var(--f-mono);font-size:.92em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .08s;text-align:center}
.btn:active{transform:translateY(2px)}
.btn-sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn-blue{background:var(--blue);color:var(--blue-ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-ok{background:var(--good);color:var(--surface)} .btn-no{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn-full{width:100%}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:14px}
.linkbtn.warn{color:var(--bad);font-weight:700}

/* Companions */
.av{display:block;flex:none}
.av svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:no-preference){
  .av.happy svg{animation:hop .6s ease}
  .av.sad svg{animation:shake .5s ease}
  .av.idle svg{animation:breathe 3.2s ease-in-out infinite}
}
@keyframes hop{30%{transform:translateY(-14%)}60%{transform:translateY(0)}75%{transform:translateY(-5%)}}
@keyframes shake{20%,60%{transform:translateX(-6%)}40%,80%{transform:translateX(6%)}}
@keyframes breathe{50%{transform:translateY(-3%)}}

/* Auth */
.auth{display:grid;gap:22px;padding-top:12px}
.hero-parade{display:flex;justify-content:center;gap:4px;margin-top:6px}
.hero-parade .av{width:72px;height:72px}
.hero-parade .av:nth-child(2) svg{animation-delay:.4s}.hero-parade .av:nth-child(3) svg{animation-delay:.8s}.hero-parade .av:nth-child(4) svg{animation-delay:1.2s}
.logo{text-align:center;display:grid;gap:6px}
.logo h1{font-size:44px;font-weight:800}
.logo h1 span{color:var(--blue)}
.logo .prompt{font-family:var(--f-mono);color:var(--blue);font-weight:600}
.logo p{color:var(--muted);max-width:30ch;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:600}
.field input{min-height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
.field input:focus{border-color:var(--blue);outline:none}
.err{color:var(--bad);font-size:14px;font-weight:600}
.err:empty{display:none}
.ok-msg{color:var(--good);font-size:14px;font-weight:600}
.ok-msg:empty{display:none}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn svg{width:20px;height:20px}
.note{font-size:13px;color:var(--muted);text-align:center}

/* Companion picker */
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:grid;justify-items:center;gap:6px;padding:16px 10px 14px;border-radius:18px;background:var(--surface);border:2px solid var(--line);text-align:center;box-shadow:0 3px 0 var(--line)}
.pick .av{width:84px;height:84px}
.pick h3{font-size:20px}
.pick p{font-size:13px;color:var(--muted)}
.pick[aria-pressed="true"]{border-color:var(--cc);box-shadow:0 3px 0 var(--cc);background:color-mix(in srgb,var(--cc) 10%,var(--surface))}
.quote{font-style:italic;color:var(--muted);text-align:center;min-height:1.5em}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{display:flex;align-items:center;gap:12px;min-width:0}
.hello .av{width:52px;height:52px}
.hello .txt{min-width:0}
.hello h1{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:6px;flex:none}
.chip{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}

/* Home modes */
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px}
.speak{display:flex;gap:12px;align-items:flex-end;margin-top:18px}
.speak .av{width:58px;height:58px}
.speak .bubble{flex:1;min-width:0;border-bottom-left-radius:4px}
.modes{display:grid;gap:14px;margin-top:20px}
.mode{display:grid;gap:10px;text-align:left;border-radius:22px;padding:20px;position:relative;overflow:hidden;min-height:170px;align-content:end}
.mode h2{font-size:28px;font-weight:800}
.mode p{max-width:32ch;opacity:.92}
.mode .meta{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px;opacity:.9}
.mode-story{background:var(--blue);color:var(--blue-ink)}
.mode-surv{background:var(--cave);color:var(--cave-ink)}
.mode .deco{position:absolute;right:14px;top:12px;font-family:var(--f-mono);font-weight:600;font-size:15px;opacity:.55;white-space:pre;text-align:right;line-height:1.5}
.mode-surv .deco{color:var(--sun);opacity:.8}
.mode:active{transform:scale(.99)}
.lvl{margin-top:20px;display:grid;gap:8px}
.lvl .row{display:flex;justify-content:space-between;align-items:baseline}
.lvl b{font-family:var(--f-display);font-size:18px}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .4s}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--blue)}

/* Story path */
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px;gap:12px}
.section-head h2{font-size:22px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;min-height:40px}
.back svg{width:20px;height:20px}
.track{list-style:none;margin:0;padding:0;display:grid;gap:12px;position:relative}
.track::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:3px;background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 14px);border-radius:2px}
.unit{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px 12px 8px;border-radius:16px}
.unit:not(:disabled):active{background:var(--surface)}
.node{flex:none;width:40px;height:40px;margin-left:8px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--surface);border:3px solid var(--line);color:var(--muted);position:relative;z-index:1}
.unit.open .node{border-color:var(--blue);color:var(--blue)}
.unit.next .node{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);box-shadow:0 0 0 6px var(--blue-soft)}
.unit.done .node{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.unit .txt{min-width:0;flex:1}
.unit h3{font-size:18px;font-weight:700}
.unit p{margin-top:2px;font-size:14px;color:var(--muted)}
.unit:disabled{cursor:default}
.unit:disabled .txt{opacity:.5}
.stars{display:flex;gap:2px;flex:none}
.stars svg{width:18px;height:18px}
.star-on{fill:var(--sun)} .star-off{fill:var(--line)}

/* Lesson */
.lbar{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:22px;height:22px}
.prog{flex:1;height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .35s ease}
.hearts{display:flex;gap:2px}
.hearts svg{width:22px;height:22px}
.h-on{fill:var(--bad)} .h-off{fill:var(--line)}
.qtype{margin-top:26px}
.qtitle{font-size:24px;font-weight:700;margin-top:6px}
.retry{display:inline-block;margin-left:8px;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--sun-soft);color:var(--ink);vertical-align:middle;font-family:var(--f-body);font-weight:700;letter-spacing:.04em}
.code{margin-top:16px;background:var(--code-bg);color:var(--code-fg);border-radius:16px;font-family:var(--f-mono);font-size:15px;line-height:1.6;overflow-x:auto}
.code pre{margin:0;padding:16px 18px;white-space:pre;font-family:inherit}
.code .dots{display:flex;gap:6px;padding:10px 14px 0}
.code .dots i{width:9px;height:9px;border-radius:50%;background:var(--code-line)}
.tk{color:var(--hk)} .ts{color:var(--hs)} .tn{color:var(--hn)} .tc{color:var(--hc);font-style:italic} .tb{color:var(--hb)}
.slot{display:inline-block;min-width:3.2ch;padding:0 6px;border-radius:6px;border:2px dashed var(--hk);color:var(--hk);text-align:center;line-height:1.3}
.slot.filled{border-style:solid;background:var(--hk);color:var(--code-bg);font-weight:600}
.opts{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.wide{grid-template-columns:1fr}
.opt{min-height:56px;padding:12px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--f-mono);font-size:15px;text-align:left;white-space:pre-wrap;word-break:break-word}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 3px 0 var(--blue)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.answer{margin-top:16px;min-height:120px;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.answer:empty::before{content:"Tap lines below to build the program";color:var(--muted);font-size:14px;margin:auto}
.pool{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.ln{text-align:left;font-family:var(--f-mono);font-size:14px;white-space:pre;overflow-x:auto;padding:10px 12px;border-radius:12px;background:var(--code-bg);color:var(--code-fg);box-shadow:0 3px 0 var(--code-line)}
.ln:disabled{cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock.ok{background:var(--good-bg);border-color:transparent}
.dock.no{background:var(--bad-bg);border-color:transparent}
.dock .in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.fb{max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;gap:10px}
.fb-head{display:flex;align-items:center;gap:10px}
.fb-head .av{width:44px;height:44px}
.fb h3{font-size:21px}
.fb .says{font-size:14px;color:var(--muted)}
.dock.ok .fb h3{color:var(--good)} .dock.no .fb h3{color:var(--bad)}
.fb .trap{padding:10px 12px;border-radius:12px;background:var(--surface);font-size:15px}
.fb code{background:var(--surface);padding:1px 6px;border-radius:6px}
.logic ol{margin:6px 0 0;padding-left:24px;display:grid;gap:6px}
.logic li{font-size:15px;padding-left:2px}
.logic li::marker{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.mini{background:var(--code-bg);color:var(--code-fg);border-radius:12px;font-family:var(--f-mono);font-size:13px;overflow-x:auto}
.mini pre{margin:0;padding:10px 12px;white-space:pre;font-family:inherit}
.spacer{height:340px}

/* Results */
.result{text-align:center;padding-top:30px;display:grid;gap:18px;justify-items:center}
.result h2{font-size:34px;font-weight:800}
.result .av{width:110px;height:110px}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:56px;height:56px}
.bigstars svg:nth-child(2){transform:translateY(-12px)}
@media (prefers-reduced-motion:no-preference){.bigstars .star-on{animation:pop .5s backwards;transform-origin:center;transform-box:fill-box}.bigstars svg:nth-child(2) .star-on{animation-delay:.15s}.bigstars svg:nth-child(3) .star-on{animation-delay:.3s}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.tile b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.result .btns{display:grid;gap:10px;width:100%;margin-top:6px}

/* Progress / profile */
.list{display:grid;gap:8px}
.row-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.row-item .t{min-width:0}
.row-item h3{font-size:16px;font-family:var(--f-body);font-weight:700}
.row-item p{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.sun{background:var(--sun-soft);color:var(--ink)}
.pill.dim{background:var(--surface-2);color:var(--muted)}
.prof-head{display:flex;align-items:center;gap:16px;margin-top:8px}
.prof-head .av{width:84px;height:84px}
.prof-head h1{font-size:28px;font-weight:800}

/* Survival */
.cave-wrap{background:var(--cave);color:var(--cave-ink);border-radius:22px;padding:18px;display:grid;gap:16px}
.cave-wrap .label{color:var(--cave-muted)}
.sbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.depth{font-family:var(--f-display);font-weight:800;font-size:20px}
.energy{display:flex;gap:2px}
.energy svg{width:20px;height:20px}
.e-on{fill:var(--sun)} .e-off{fill:var(--cave-2)}
.gems{font-family:var(--f-mono);font-weight:600;color:var(--sun);font-size:14px}
.qgrid{display:grid;gap:16px;margin-top:14px}
@media (min-width:900px){.qgrid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.qgrid .ws{position:sticky;top:16px}}
.qside{display:grid;gap:14px;min-width:0}
.cave-speak{display:flex;gap:12px;align-items:flex-start}
.cave-speak .av{width:64px;height:64px}
.cave-bubble{flex:1;min-width:0;background:var(--cave-2);border-radius:16px;border-top-left-radius:4px;padding:12px 14px;font-size:15px;display:grid;gap:4px}
.cave-bubble b{color:var(--sun)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.task h3{font-size:20px}
.task .sig{font-family:var(--f-mono);font-size:14px;background:var(--surface-2);padding:8px 10px;border-radius:10px;overflow-x:auto;white-space:pre}
.examples{display:grid;gap:4px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.examples div{overflow-x:auto;white-space:pre}
.hints{display:grid;gap:10px}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);border-radius:14px;padding:10px 12px;font-size:15px}
.hint .av{width:34px;height:34px}
.hint b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint .mini{margin-top:6px}
.ws{background:var(--code-bg);border-radius:18px;overflow:hidden;min-width:0;display:grid}
.ws-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:var(--hc);font-family:var(--f-mono);font-size:13px;gap:10px}
.ws-head .eng{display:flex;align-items:center;gap:6px}
.ws-head .eng i{width:8px;height:8px;border-radius:50%;background:var(--hc)}
.ws-head .eng.ready i{background:var(--hs)}
.editor{width:100%;min-height:260px;resize:vertical;border:0;outline:none;background:transparent;color:var(--code-fg);font-family:var(--f-mono);font-size:15px;line-height:1.6;padding:6px 16px 16px;tab-size:4;white-space:pre;overflow-x:auto}
.editor:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--sun)}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--code-line);scrollbar-width:none}
.keys button{flex:none;min-width:40px;height:38px;padding:0 10px;border-radius:9px;background:var(--code-line);color:var(--code-fg);font-family:var(--f-mono);font-size:15px}
.ws-actions{display:flex;gap:10px;padding:12px;border-top:1px solid var(--code-line);flex-wrap:wrap}
.ws-actions .btn{flex:1}
.ws-actions .btn-ghost{background:transparent;border-color:var(--code-line);color:var(--code-fg);flex:0 0 auto}
.console{border-top:1px solid var(--code-line);padding:12px 16px 16px;font-family:var(--f-mono);font-size:13px;color:var(--code-fg);display:grid;gap:8px}
.console:empty{display:none}
.console .h{color:var(--hc);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.console pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:inherit}
.trow{display:flex;gap:8px;align-items:flex-start}
.trow .m{flex:none;font-weight:600}
.trow.pass .m{color:var(--hs)} .trow.fail .m{color:var(--hn)}
.trow .d{min-width:0;overflow-x:auto;white-space:pre}
.errbox{color:var(--hn)}
.win{background:var(--good-bg);border-radius:16px;padding:16px;display:grid;gap:10px}
.win h3{color:var(--good);font-size:22px}
.lose{background:var(--bad-bg);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.lose h3{color:var(--bad);font-size:19px}
.lobby{display:grid;gap:14px}
.lobby .av{width:96px;height:96px}
.lobby-hero{display:flex;gap:16px;align-items:center}
.chambers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chamber{aspect-ratio:1;max-width:100%;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--cave-2);color:var(--cave-muted)}
.chamber.cleared{background:var(--sun);color:var(--sun-ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:min(90vw,420px);text-align:center}
.loading{display:grid;place-items:center;min-height:60vh;gap:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const UNITS = [
 {title:"Variables & numbers", blurb:"Names, types, arithmetic", qs:[
  {t:"out", code:"x = 5\ny = x + 2\nprint(y)", opts:["7","5","x + 2","52"], a:0,
   steps:["x = 5 stores the number 5 in x.","y = x + 2 looks up x (5) and adds 2, so y holds 7.","print(y) shows the value of y: 7."],
   trap:{"5":"That is x. y was calculated from x, but it is a separate variable.","x + 2":"Python evaluates the expression. It never prints the code you wrote.","52":"That would be text joining (\"5\" + \"2\"). Here both values are numbers, so + adds."}},
  {t:"out", code:"print(type(3.0))", opts:["<class 'float'>","<class 'int'>","<class 'str'>","3"], a:0,
   steps:["3.0 has a decimal point, so Python creates a float, even though the value is a whole number.","type() returns the class of a value.","print shows a class as <class 'float'>."],
   trap:{"<class 'int'>":"3 would be an int. The .0 makes it a float.","<class 'str'>":"It would be a str only inside quotes, like \"3.0\".","3":"print(type(...)) shows the type, not the value."}},
  {t:"fill", q:"Make it print Hi, Ada", code:"name = \"Ada\"\nprint(\"Hi, \" ___ name)", opts:["+","*","/","-"], a:0,
   steps:["Both sides are strings: \"Hi, \" and name, which holds \"Ada\".","+ between two strings joins them: \"Hi, \" + \"Ada\" becomes \"Hi, Ada\".","print shows the joined string."],
   trap:{"*":"str * str raises a TypeError. * only works as str * int, which repeats text.","/":"Strings cannot be divided. TypeError.","-":"Strings cannot be subtracted. TypeError."}},
  {t:"out", code:"print(7 // 2, 7 % 2)", opts:["3 1","3.5 1","3 0.5","4 1"], a:0,
   steps:["7 // 2 is floor division: 7 / 2 = 3.5, rounded down to 3.","7 % 2 is the remainder: 2 fits into 7 three times (6), leaving 1.","print with two values puts a space between them: 3 1."],
   trap:{"3.5 1":"3.5 is the result of 7 / 2. The double slash // drops the fraction.","3 0.5":"% gives the whole remainder, 1, not a fraction.","4 1":"// always rounds down, not to the nearest number."}},
  {t:"order", q:"Build a program that prints the average, 5.0", lines:["a = 4","b = 6","avg = (a + b) / 2","print(avg)"],
   alts:[[1,0,2,3]],
   steps:["a and b must be defined before any line uses them. Their order between each other doesn't matter: b = 6 then a = 4 works too.","avg = (a + b) / 2 computes (4 + 6) / 2 = 10 / 2.","A single / always returns a float, so avg is 5.0, not 5.","print(avg) goes last, once avg exists."]}
 ]},
 {title:"Strings", blurb:"Indexing, slicing, methods", qs:[
  {t:"out", code:"s = \"python\"\nprint(s[0], s[-1])", opts:["p n","p o","y n","python"], a:0,
   steps:["Strings are indexed from 0: p=0, y=1, t=2, h=3, o=4, n=5.","s[0] is the first character, \"p\".","Negative indexes count from the end, so s[-1] is the last character, \"n\".","print separates the two values with a space: p n."],
   trap:{"p o":"s[-1] is the last character, n. o is s[-2].","y n":"Indexing starts at 0, so s[0] is p, not y.","python":"An index picks one character, not the whole string."}},
  {t:"out", code:"print(\"ha\" * 3)", opts:["hahaha","ha3","ha ha ha","Error"], a:0,
   steps:["A string times an integer repeats the string.","\"ha\" * 3 is the same as \"ha\" + \"ha\" + \"ha\".","No spaces are added, so the result is hahaha."],
   trap:{"ha3":"* does not turn 3 into text. It repeats the string.","ha ha ha":"Repetition adds no separators between copies.","Error":"str * int is valid. Only str * str fails."}},
  {t:"out", code:"print(\"Hello\"[1:4])", opts:["ell","Hel","ello","ell o"], a:0,
   steps:["Number the letters: H=0, e=1, l=2, l=3, o=4.","The slice [1:4] starts at index 1 and stops before index 4, so it takes 1, 2, 3.","Those characters are e, l, l, giving \"ell\"."],
   trap:{"Hel":"That is [0:3]. This slice starts at index 1.","ello":"That is [1:5]. The end index, 4, is excluded.","ell o":"A slice is one continuous piece. Nothing is skipped or spaced."}},
  {t:"fill", q:"Make it print LOOP", code:"word = \"loop\"\nprint(word.___())", opts:["upper","lower","title","strip"], a:0,
   steps:["word.___() calls a method on the string \"loop\".","upper() returns a new string with every letter capitalised: \"LOOP\".","print shows LOOP. The original word is unchanged, because strings cannot be modified in place."],
   trap:{"lower":"lower() makes everything lowercase: \"loop\".","title":"title() capitalises only the first letter of each word: \"Loop\".","strip":"strip() removes spaces around the text. It stays \"loop\"."}},
  {t:"out", code:"print(len(\"data science\"))", opts:["12","11","2","13"], a:0,
   steps:["len counts every character in a string.","\"data\" has 4, the space has 1, \"science\" has 7.","4 + 1 + 7 = 12."],
   trap:{"11":"You probably skipped the space. Spaces count as characters.","2":"len counts characters, not words.","13":"Count again: d-a-t-a (4), space (1), s-c-i-e-n-c-e (7)."}}
 ]},
 {title:"Lists", blurb:"Append, slice, sort, references", qs:[
  {t:"out", code:"nums = [3, 1, 2]\nnums.append(5)\nprint(nums)", opts:["[3, 1, 2, 5]","[5, 3, 1, 2]","[1, 2, 3, 5]","[3, 1, 2]"], a:0,
   steps:["nums starts as [3, 1, 2].",".append(5) adds 5 to the end. It changes the list in place.","The existing order is kept. Nothing is sorted. Result: [3, 1, 2, 5]."],
   trap:{"[5, 3, 1, 2]":"append adds at the end. Adding at the front needs insert(0, 5).","[1, 2, 3, 5]":"append never sorts. You would need sort() for that.","[3, 1, 2]":"append changes nums in place, so print sees the 5."}},
  {t:"out", code:"a = [10, 20, 30, 40]\nprint(a[1:3])", opts:["[20, 30]","[10, 20, 30]","[20, 30, 40]","[30, 40]"], a:0,
   steps:["Indexes: 10 is 0, 20 is 1, 30 is 2, 40 is 3.","[1:3] takes index 1 and 2, stopping before 3.","Result: [20, 30]. List slices follow the same rule as string slices."],
   trap:{"[10, 20, 30]":"That is a[0:3]. This slice starts at 1.","[20, 30, 40]":"That is a[1:4]. Index 3 is excluded here.","[30, 40]":"That is a[2:4]."}},
  {t:"fill", q:"Make fruits equal [\"fig\", \"kiwi\"]", code:"fruits = [\"fig\"]\nfruits.___(\"kiwi\")", opts:["append","add","push","insert"], a:0,
   steps:["fruits is a list: [\"fig\"].","Lists add one item to the end with .append(item).","After the call, fruits is [\"fig\", \"kiwi\"]."],
   trap:{"add":"add() belongs to sets. On a list it raises AttributeError.","push":"push is from JavaScript. Python lists have no push method.","insert":"insert needs a position first, like insert(1, \"kiwi\"). With one argument it raises TypeError."}},
  {t:"out", code:"print(sorted([3, 1, 2], reverse=True))", opts:["[3, 2, 1]","[1, 2, 3]","[2, 1, 3]","None"], a:0,
   steps:["sorted() builds a new sorted list and leaves the original alone.","By default it sorts smallest first: [1, 2, 3].","reverse=True flips that order: [3, 2, 1]."],
   trap:{"[1, 2, 3]":"That ignores reverse=True.","[2, 1, 3]":"That is the input reversed, not sorted.","None":"list.sort() returns None. sorted() returns the new list."}},
  {t:"out", code:"x = [1, 2]\ny = x\ny.append(3)\nprint(x)", opts:["[1, 2, 3]","[1, 2]","[3]","Error"], a:0,
   steps:["x = [1, 2] creates one list object in memory.","y = x makes y a second name for that same object. No copy is made.","y.append(3) changes the shared list.","So x also shows [1, 2, 3]. To get an independent copy, write y = x.copy()."],
   trap:{"[1, 2]":"That would be true if y were a copy. Assigning a list never copies it.","[3]":"append adds to the existing list. It does not replace it.","Error":"Every line here is valid Python."}}
 ]},
 {title:"Conditionals", blurb:"if, elif, else, booleans", qs:[
  {t:"out", code:"t = 18\nif t > 25:\n    print(\"hot\")\nelif t > 15:\n    print(\"mild\")\nelse:\n    print(\"cold\")", opts:["mild","hot","cold","mild cold"], a:0,
   steps:["t is 18.","First check: 18 > 25 is False, so \"hot\" is skipped.","Next check: 18 > 15 is True, so \"mild\" is printed.","Once one branch runs, Python skips the rest of the chain, including else."],
   trap:{"hot":"18 > 25 is False.","cold":"else only runs when every condition above it is False.","mild cold":"An if / elif / else chain runs at most one branch."}},
  {t:"out", code:"print(5 > 3 and 2 > 4)", opts:["False","True","None","Error"], a:0,
   steps:["5 > 3 is True.","2 > 4 is False.","and is True only when both sides are True. True and False gives False."],
   trap:{"True":"That would be the result of or. and needs both sides True.","None":"Comparisons always give True or False, never None.","Error":"Comparing integers is valid."}},
  {t:"fill", q:"Print even for even numbers", code:"if n ___ 2 == 0:\n    print(\"even\")", opts:["%","//","/","**"], a:0,
   steps:["A number is even when dividing it by 2 leaves nothing over.","n % 2 gives that remainder: 0 for even numbers, 1 for odd numbers.","So n % 2 == 0 is True exactly when n is even."],
   trap:{"//":"n // 2 is how many times 2 fits. It equals 0 only for n = 0 or 1.","/":"n / 2 equals 0 only when n is 0.","**":"n ** 2 is n squared. It equals 0 only when n is 0."}},
  {t:"out", code:"print(bool(\"\"), bool(\"0\"))", opts:["False True","False False","True True","True False"], a:0,
   steps:["bool() asks whether a value counts as True.","Empty things count as False: \"\", [], {}, 0, None.","\"\" is empty, so bool(\"\") is False.","\"0\" is a string containing one character, so it is not empty: True."],
   trap:{"False False":"\"0\" is text, not the number 0. Any non-empty string is True.","True True":"The empty string counts as False.","True False":"It is the other way round."}},
  {t:"order", q:"Build a program that prints odd", lines:["n = 7","if n % 2 == 0:","    print(\"even\")","else:","    print(\"odd\")"],
   steps:["n = 7 comes first so the condition has a value to test.","if n % 2 == 0: checks for even. 7 % 2 is 1, so this is False.","The indented print(\"even\") belongs to the if, so it is skipped.","else: catches every other case, and its indented print(\"odd\") runs."]}
 ]},
 {title:"Loops", blurb:"for, while, range, break", qs:[
  {t:"out", code:"for i in range(3):\n    print(i, end=\" \")", opts:["0 1 2","1 2 3","0 1 2 3","3"], a:0,
   steps:["range(3) produces 0, 1, 2. It starts at 0 and stops before 3.","The loop body runs once for each value and prints i.","end=\" \" replaces the usual newline with a space, so everything stays on one line: 0 1 2."],
   trap:{"1 2 3":"range starts at 0 unless you give a start value.","0 1 2 3":"The stop value, 3, is never included.","3":"range(3) produces three values, not the number 3."}},
  {t:"out", code:"total = 0\nfor n in [1, 2, 3, 4]:\n    total += n\nprint(total)", opts:["10","4","1234","0"], a:0,
   steps:["total starts at 0.","Each pass adds n: after 1 it is 1, after 2 it is 3, after 3 it is 6, after 4 it is 10.","print is not indented, so it runs once after the loop: 10."],
   trap:{"4":"That is the last n. total keeps a running sum.","1234":"total += n adds numbers. It does not join them as text.","0":"total += n updates total on every pass."}},
  {t:"out", code:"i = 0\nwhile i < 10:\n    i += 3\nprint(i)", opts:["12","9","10","15"], a:0,
   steps:["Start with i = 0. 0 < 10 is True, so i becomes 3.","3 < 10, so i becomes 6. 6 < 10, so i becomes 9. 9 < 10, so i becomes 12.","Now 12 < 10 is False, so the loop stops.","print(i) runs after the loop and shows 12."],
   trap:{"9":"At 9 the check 9 < 10 is still True, so the loop runs one more time.","10":"i grows by 3 each time, so it never equals 10.","15":"At 12 the condition is already False, so the loop stops."}},
  {t:"fill", q:"Make it print only 0 1 2", code:"for i in range(5):\n    if i == 3:\n        ___\n    print(i)", opts:["break","continue","pass","return"], a:0,
   steps:["The loop goes through i = 0, 1, 2, 3, 4.","For 0, 1 and 2, the if is False, so print(i) runs.","At i = 3, break exits the whole loop at once. 3 and 4 are never printed."],
   trap:{"continue":"continue skips only i = 3, then carries on and prints 4. Output: 0 1 2 4.","pass":"pass does nothing, so all of 0 to 4 print.","return":"return only works inside a function. Here it is a SyntaxError."}},
  {t:"out", code:"print(list(range(2, 10, 3)))", opts:["[2, 5, 8]","[2, 5, 8, 11]","[3, 6, 9]","[2, 3, 4]"], a:0,
   steps:["range(start, stop, step): start is 2, stop is 10, step is 3.","Values: 2, then 5, then 8. The next would be 11, which is not below 10.","list() collects them: [2, 5, 8]."],
   trap:{"[2, 5, 8, 11]":"11 is past the stop value, 10.","[3, 6, 9]":"The sequence starts at 2, not 3.","[2, 3, 4]":"The third argument is the step size, 3."}}
 ]},
 {title:"Functions", blurb:"def, return, defaults", qs:[
  {t:"out", code:"def double(x):\n    return x * 2\n\nprint(double(4))", opts:["8","4","x * 2","None"], a:0,
   steps:["def double(x): defines the function. Nothing runs yet.","double(4) calls it, with x set to 4.","return x * 2 sends back 8.","print shows the returned value: 8."],
   trap:{"4":"The function doubles x before returning it.","x * 2":"Code is evaluated. It is never printed as text.","None":"The function has a return statement, so it gives back a value."}},
  {t:"out", code:"def greet(name=\"friend\"):\n    return \"Hi \" + name\n\nprint(greet())", opts:["Hi friend","Hi","Hi name","Error"], a:0,
   steps:["name=\"friend\" gives the parameter a default value.","greet() passes no argument, so name uses the default, \"friend\".","\"Hi \" + \"friend\" is \"Hi friend\"."],
   trap:{"Hi":"name is not empty. It falls back to the default.","Hi name":"name is a variable, so its value is used, not its name.","Error":"With a default value, the argument becomes optional."}},
  {t:"fill", q:"Make square(3) give back 9", code:"def square(n):\n    ___ n * n", opts:["return","print","def","yield"], a:0,
   steps:["\"Give back\" means the caller receives a value it can store, like x = square(3).","return n * n sends 9 back to the caller.","After the call, x would hold 9."],
   trap:{"print":"print shows 9 on screen, but the function still returns None. x would be None.","def":"def starts a new function definition. It cannot go here.","yield":"yield turns the function into a generator, so square(3) would not equal 9."}},
  {t:"out", code:"def f():\n    pass\n\nprint(f())", opts:["None","pass","0","Error"], a:0,
   steps:["pass is a placeholder. It does nothing.","The function ends without a return statement.","Python then returns None automatically, and print shows None."],
   trap:{"pass":"pass is a statement, not a value.","0":"The automatic return value is None, not 0.","Error":"A function containing only pass is valid."}},
  {t:"order", q:"Build a program that prints 12", lines:["def area(w, h):","    return w * h","result = area(3, 4)","print(result)"],
   steps:["def area(w, h): must come before any call to area.","The indented return w * h is the function's body.","area(3, 4) computes 3 * 4 = 12 and stores it in result.","print(result) shows 12."]}
 ]},
 {title:"Dictionaries", blurb:"Keys, values, get, items", qs:[
  {t:"out", code:"ages = {\"ana\": 30, \"bo\": 25}\nprint(ages[\"bo\"])", opts:["25","30","bo","Error"], a:0,
   steps:["ages maps names (keys) to numbers (values).","ages[\"bo\"] looks up the key \"bo\".","The value stored there is 25."],
   trap:{"30":"30 belongs to the key \"ana\".","bo":"Square brackets return the value, not the key.","Error":"The key exists, so there is no KeyError."}},
  {t:"out", code:"d = {\"a\": 1}\nd[\"b\"] = 2\nprint(len(d))", opts:["2","1","3","4"], a:0,
   steps:["d starts with one pair: \"a\": 1.","d[\"b\"] = 2 adds a new pair, because \"b\" was not a key yet.","len(d) counts the keys: 2."],
   trap:{"1":"Assigning to a missing key creates it.","3":"len counts pairs. 1 and 2 are values, not extra entries.","4":"Each key and its value count as one entry."}},
  {t:"out", code:"d = {\"x\": 1}\nprint(d.get(\"y\", 0))", opts:["0","None","1","KeyError"], a:0,
   steps:["\"y\" is not a key in d.","d[\"y\"] would crash with a KeyError, but .get handles missing keys.",".get(key, default) returns the default when the key is missing, so it gives 0."],
   trap:{"None":"None is returned only when you leave out the second argument.","1":"1 belongs to the key \"x\".","KeyError":"Only d[\"y\"] raises KeyError. .get is the safe lookup."}},
  {t:"fill", q:"Loop over keys and values together", code:"for key, value in scores.___():\n    print(key, value)", opts:["items","keys","values","pairs"], a:0,
   steps:["for key, value in ... unpacks two things on every pass.",".items() yields (key, value) pairs, which fill both names at once."],
   trap:{"keys":".keys() yields one key at a time, so unpacking into two names fails.","values":".values() yields one value at a time, so unpacking fails.","pairs":"Dictionaries have no .pairs() method. AttributeError."}},
  {t:"out", code:"sq = {n: n * n for n in range(3)}\nprint(sq)", opts:["{0: 0, 1: 1, 2: 4}","{1: 1, 2: 4, 3: 9}","[0, 1, 4]","{0, 1, 4}"], a:0,
   steps:["range(3) gives n = 0, 1, 2.","For each n, the comprehension adds the pair n: n * n.","0 gives 0: 0, 1 gives 1: 1, 2 gives 2: 4. Result: {0: 0, 1: 1, 2: 4}."],
   trap:{"{1: 1, 2: 4, 3: 9}":"range(3) starts at 0 and stops before 3.","[0, 1, 4]":"Curly braces with key: value make a dict, not a list.","{0, 1, 4}":"That is a set. The colon makes it a dict."}}
 ]}
];

  solution:py("def gate_code(a, b):","    return a + b")},
 {id:"torch", title:"Torches in the Hall", fn:"count_torches", sig:"count_torches(rooms)",

  hints:["Go through the list one item at a time with a for loop.","Inside the loop, check: if room == \"torch\":","When it matches, add 1: count += 1. Return count after the loop ends."],
  logic:["count starts at 0, the right answer for an empty list.","for room in rooms visits every item once.","Each match adds 1 to count.","return count runs after the loop, so it reports the full total. A shortcut also works: return rooms.count(\"torch\")."],
  solution:py("def count_torches(rooms):","    count = 0","    for room in rooms:","        if room == \"torch\":","            count += 1","    return count")},
 {id:"echo", title:"The Echo Bridge", fn:"echo", sig:"echo(word)",
  story:"A rope bridge hangs over a canyon. Whatever {c} shouts comes back reversed, and the bridge only holds if you answer with the echo first.",
  task:"Return word written backwards. echo(\"cave\") returns \"evac\".",
  starter:py("def echo(word):","    pass"),

 {id:"stones", title:"Even Stepping Stones", fn:"even_stones", sig:"even_stones(nums)",

function hl(src,fill){
  const re=/(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(\d+(?:\.\d+)?)\b|(___)|\b([A-Za-z_]\w*)\b/gm;
  let out="",last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index)); last=re.lastIndex;
    if(m[1]) out+='<span class="tc">'+esc(m[1])+'</span>';
    else if(m[2]) out+='<span class="ts">'+esc(m[2])+'</span>';
    else if(m[3]) out+='<span class="tn">'+m[3]+'</span>';
    else if(m[4]) out+= fill!=null ? '<span class="slot filled">'+esc(fill)+'</span>' : '<span class="slot">&nbsp;</span>';
    else if(KW.has(m[5])) out+='<span class="tk">'+m[5]+'</span>';
    else if(BI.has(m[5])) out+='<span class="tb">'+m[5]+'</span>';
    else out+=m[5];
  }
  return out+esc(src.slice(last));
}

async function loadCloudProfile(user){
  MODE={kind:"firebase",uid:user.uid};
  const cached=lsGet(localKey());
  let data=null;
  try{ const snap=await fbDb.collection("users").doc(user.uid).get(); if(snap.exists) data=snap.data(); }
  catch(e){ toast("Offline. Using progress saved on this device."); data=cached; }
  P=Object.assign(blankP((user.displayName||user.email||"Explorer").split("@")[0]), data||{});

/* ================= Boot ================= */
async function boot(){
  const ok=await initFirebase();
  if(ok){
    fbAuth.getRedirectResult().catch(e=>toast(authErr(e)));
    fbAuth.onAuthStateChanged(async u=>{
      stopVerifyPoll();
      if(u && needsVerify(u)){ verifyScreen(u); }
      else if(u){ await loadCloudProfile(u); afterLogin(); }
      else if(lsGet("pyquest.session")==="guest"){ startGuest(); }
      else authScreen();
    });
  } else {
    if(lsGet("pyquest.session")==="guest") startGuest(); else authScreen();
  }
}
function startGuest(name){
  MODE={kind:"guest"};
  P=lsGet("pyquest.guest");
  if(!P){ P=blankP(name);
    const old=lsGet("pyquest.v1"); // progress from the first PyQuest version
    if(old){ P.xp=old.xp||0; P.stars=old.stars||{}; P.streak=old.streak||0; P.lastDay=old.lastDay||""; }
  } else { P=Object.assign(blankP(),P); if(name) P.name=name; }
  lsSet("pyquest.session","guest"); saveP(); afterLogin();
}

      const cls=st?"done":(i===nextIdx?"next":(op?"open":""));

const PROMPTS={out:"What does this print?",fill:"Fill in the blank",order:"Put the lines in order"};
let L=null;
function startLesson(u){
  setWide(false,false);
  const qs=UNITS[u].qs.map(q=>({...q}));
  L={u,queue:qs,total:qs.length,done:0,hearts:3,mistakes:0,xp:0,firstTry:0};
  setupQ(); renderLesson();
}
function setupQ(){
  const q=L.queue[0]; L.sel=null; L.checked=false; L.correct=false;
  if(q.t==="order"){ L.picked=[]; let p; do{p=shuffle(q.lines.map((_,i)=>i))}while(p.every((v,i)=>v===i)); L.pool=p; }
  else L.opts=shuffle(q.opts);
}
function feedback(q,chosen,correct){
  const ans=q.t==="order"?null:q.opts[q.a];
  let h=`<div class="fb-head">${av(P.companion,correct?"happy":"sad")}<div><h3>${correct?"Correct!":"Not quite"}</h3><p class="says">${C().name}: ${esc(pick(correct?C().cheer:C().oops))}</p></div></div>`;
  if(!correct){
    if(chosen!=null && q.trap && q.trap[chosen]) h+=`<p class="trap"><b>Why <code>${esc(chosen)}</code> is wrong:</b> ${esc(q.trap[chosen])}</p>`;
    if(ans!=null) h+=`<p>Correct answer: <code>${esc(ans)}</code></p>`;
    else h+=`<p>Correct order:</p><div class="mini"><pre>${hl(q.lines.join("\n"))}</pre></div>`;
  }
  h+=`<div class="logic"><span class="label">The logic</span><ol>${q.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
  return `<div class="fb">${h}</div>`;
}
function renderLesson(){
  const q=L.queue[0], pct=Math.round(L.done/L.total*100);
  const wide=q.t!=="order" && L.opts.some(o=>o.length>9);
  let body="";
  if(q.t==="order"){
    body=`<div class="answer">${L.picked.map((li,k)=>`<button class="ln" data-k="${k}" ${L.checked?"disabled":""}>${hl(q.lines[li])}</button>`).join("")}</div>
      <div class="pool">${L.pool.map((li,k)=>`<button class="ln" data-p="${k}" ${L.checked?"disabled":""}>${hl(q.lines[li])}</button>`).join("")}</div>`;
  } else {
    const ans=q.opts[q.a];
    body=codeBlock(q.code, q.t==="fill"&&L.sel!=null?L.sel:null)+
     `<div class="opts ${wide?"wide":""}">${L.opts.map((o,k)=>{let c="";
        if(L.checked){ if(o===ans) c="right"; else if(o===L.sel) c="wrong"; } else if(o===L.sel) c="sel";
        return `<button class="opt ${c}" data-o="${k}" ${L.checked?"disabled":""}>${esc(o)}</button>`}).join("")}</div>`;
  }
  const ready = q.t==="order" ? L.picked.length===q.lines.length : L.sel!=null;
  const dock = !L.checked
    ? `<div class="dock"><div class="in"><button class="btn btn-blue btn-full" id="check" ${ready?"":"disabled"}>Check</button></div></div>`
    : `<div class="dock ${L.correct?"ok":"no"}" role="status"><div class="in">${feedback(q,q.t==="order"?null:L.sel,L.correct)}
        <button class="btn btn-full ${L.correct?"btn-ok":"btn-no"}" id="next">Continue</button></div></div>`;
  app.innerHTML=`
   <div class="lbar">
     <button class="x" id="quit" aria-label="Quit lesson">${ICON.close}</button>
     <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
     <div class="hearts" aria-label="${L.hearts} hearts left">${[0,1,2].map(i=>ICON.heart(i<L.hearts)).join("")}</div>
   </div>
   <div class="qtype"><span class="label">${UNITS[L.u].title}</span>
     <h2 class="qtitle">${q.q?esc(q.q):PROMPTS[q.t]}${q.retry?'<span class="retry">RETRY</span>':""}</h2></div>
   ${body}<div class="spacer"></div>${dock}`;
  document.getElementById("quit").onclick=storyPath;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{L.sel=L.opts[+b.dataset.o]; renderLesson();});
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{L.picked.push(L.pool.splice(+b.dataset.p,1)[0]); renderLesson();});
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{L.pool.push(L.picked.splice(+b.dataset.k,1)[0]); renderLesson();});
  const c=document.getElementById("check"); if(c) c.onclick=check;
  const n=document.getElementById("next"); if(n){ n.onclick=advance; n.focus({preventScroll:true}); }
}
function check(){
  const q=L.queue[0];
  L.correct = q.t==="order" ? [q.lines.map((_,i)=>i),...(q.alts||[])].some(o=>o.every((v,i)=>L.picked[i]===v)) : L.sel===q.opts[q.a];
  L.checked=true;
  if(L.correct){ L.xp+=q.retry?5:10; if(!q.retry) L.firstTry++; } else { L.hearts--; L.mistakes++; }
  renderLesson();
}
function advance(){
  const q=L.queue.shift();
  if(L.correct) L.done++; else L.queue.push({...q,retry:true});
  if(L.hearts<=0) return lessonEnd(false);
  if(!L.queue.length) return lessonEnd(true);
  setupQ(); renderLesson(); window.scrollTo(0,0);
}
function lessonEnd(won){
  let stars=0, bonus=0;
  if(won){ stars=L.mistakes===0?3:L.mistakes===1?2:1; if(stars===3) bonus=20;
    P.stars[L.u]=Math.max(P.stars[L.u]||0,stars); P.xp+=L.xp+bonus; bumpStreak(); saveP(); }
  const acc=Math.round(L.firstTry/L.total*100), hasNext=won&&L.u+1<UNITS.length, u=L.u;
  app.innerHTML=`<div class="result">
    ${av(P.companion,won?"happy":"sad")}
    <span class="label">${UNITS[u].title}</span>
    <div class="bigstars">${[1,2,3].map(n=>ICON.star(n<=stars)).join("")}</div>
    <h2>${won?(stars===3?"Flawless run":"Unit complete"):"Out of hearts"}</h2>
    <p class="muted" style="max-width:34ch">${C().name}: ${won?(stars===3?"No mistakes. That's a 20 XP bonus.":"Replay without a mistake for three stars."):"Each wrong answer costs a heart. Read the logic notes and try again."}</p>
    <div class="tiles">
      <div class="tile"><b>+${won?L.xp+bonus:0}</b><span>XP</span></div>
      <div class="tile"><b>${acc}%</b><span>first try</span></div>
      <div class="tile"><b>${liveStreak()}</b><span>day streak</span></div>
    </div>
    <div class="btns">
      ${hasNext?`<button class="btn btn-blue btn-full" id="nx">Next unit: ${UNITS[u+1].title}</button>`:""}
      <button class="btn ${hasNext?"btn-ghost":"btn-blue"} btn-full" id="again">${won?"Replay unit":"Try again"}</button>
      <button class="btn btn-ghost btn-full" id="hm">Back to course path</button>
    </div></div>`;
  if(hasNext) document.getElementById("nx").onclick=()=>startLesson(u+1);
  document.getElementById("again").onclick=()=>startLesson(u);
  document.getElementById("hm").onclick=storyPath;
  window.scrollTo(0,0);
}

/* ================= Python engine (Skulpt) ================= */
const SK_BASE="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/";
let skP=null, skReady=false;
function loadSkulpt(){
  if(!skP) skP=loadScript(SK_BASE+"skulpt.min.js").then(()=>loadScript(SK_BASE+"skulpt-stdlib.js")).then(()=>{skReady=true; markEngine();}).catch(e=>{skP=null; throw e;});
  return skP;
}
function markEngine(){const e=document.getElementById("eng"); if(e){e.classList.toggle("ready",skReady); e.lastChild.textContent=skReady?" Python ready":" loading Python…";}}
function skRead(f){ if(!Sk.builtinFiles||!Sk.builtinFiles.files[f]) throw new Error("File not found: '"+f+"'"); return Sk.builtinFiles.files[f]; }
function fmtErr(e){ const s=e&&e.toString?e.toString():String(e); return s.replace(/ on line (\d+)/," (line $1)"); }
function canon(v){ if(Array.isArray(v)) return "["+v.map(canon).join(",")+"]"; if(v&&typeof v==="object"){return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}"} return JSON.stringify(v===undefined?null:v); }
function pyRepr(v){
  if(v===null||v===undefined) return "None"; if(v===true) return "True"; if(v===false) return "False";
  if(typeof v==="string") return "'"+v.replace(/\\/g,"\\\\").replace(/'/g,"\\'")+"'";
  if(Array.isArray(v)) return "["+v.map(pyRepr).join(", ")+"]";
  if(typeof v==="object") return "{"+Object.keys(v).map(k=>pyRepr(k)+": "+pyRepr(v[k])).join(", ")+"}";
  return String(v);
}
const callStr=(q,args)=>q.fn+"("+args.map(pyRepr).join(", ")+")";

/* ================= Survival mode ================= */
let Q=null;
function stopAll(){ Q=null; }
function survivalLobby(){
  setWide(false,true); tabs("home");
  const best=P.survBest, cps=[0,3,6].filter(c=>c===0||best>=c);
  app.innerHTML=`<button class="back" id="sv-back">${ICON.back}Home</button>
  <div class="cave-wrap lobby" style="margin-top:6px">
    <div class="lobby-hero">${av(P.companion)}<div><span class="label">Survival mode</span><h2 style="font-size:28px;font-weight:800">Ruins of Recursion</h2></div></div>
    <div class="cave-bubble"><span><b>${C().name}:</b> The Source Stone is hidden at the bottom of the ruins, ten chambers down. Each chamber has a puzzle only code can solve. You write the Python, I'll give hints when you need them.</span></div>
    <div class="chambers" aria-label="Chambers cleared">${QUESTS.map((q,i)=>`<div class="chamber ${P.solved[q.id]?"cleared":""}" title="${esc(q.title)}">${i+1}</div>`).join("")}</div>
    <div class="list" style="gap:6px">
      <p style="font-size:14px;color:var(--cave-muted)">You start with 5 energy. A wrong answer costs 1. Code errors and hints are free, but hints lower your gem reward. Best run: <b style="color:var(--sun)">${best}</b> chambers.</p>
    </div>
    ${P.run?`<button class="btn btn-sun btn-full" id="sv-cont">Continue run · chamber ${P.run.depth+1} · ${P.run.energy} energy</button>`:""}
    <div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      ${cps.map(c=>`<button class="btn ${P.run||c?"btn-ghost":"btn-sun"} btn-full" data-cp="${c}" style="${P.run||c?"background:transparent;border-color:var(--cave-2);color:var(--cave-ink)":""}">${c===0?(P.run?"Start new run":"Start run"):"Start at chamber "+(c+1)}</button>`).join("")}
    </div>
  </div>`;
  document.getElementById("sv-back").onclick=home;
  const ct=document.getElementById("sv-cont"); if(ct) ct.onclick=openQuest;
  app.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{P.run={depth:+b.dataset.cp,energy:5,gems:0}; saveP(); openQuest();});
  loadSkulpt().catch(()=>{});
  window.scrollTo(0,0);
}
function openQuest(){
  const q=QUESTS[P.run.depth];
  Q={q,hints:0,solved:false,revealed:false};
  setWide(true,false);
  const ex=q.tests.slice(0,2).map(([a,e])=>`<div>${esc(callStr(q,a))}  →  ${esc(pyRepr(e))}</div>`).join("");
  app.innerHTML=`
  <div class="cave-wrap">
    <div class="sbar">
      <button class="x" id="sv-quit" aria-label="Leave the ruins" style="color:var(--cave-muted)">${ICON.close}</button>
      <span class="depth">Chamber ${P.run.depth+1}<span style="color:var(--cave-muted);font-size:15px"> / ${QUESTS.length}</span></span>
      <span style="flex:1"></span>
      <span class="gems" title="Gems this run">◆ ${P.run.gems}</span>
      <span class="energy" id="energy" aria-label="${P.run.energy} energy">${[0,1,2,3,4].map(i=>ICON.energy(i<P.run.energy)).join("")}</span>
    </div>
    <div class="cave-speak">${av(P.companion)}<div class="cave-bubble"><span class="label">${esc(q.title)}</span><span><b>${C().name}:</b> ${esc(say(q.story))}</span></div></div>
  </div>
  <div class="qgrid">
    <div class="qside">
      <div class="task"><span class="label">Your mission</span><h3>${esc(q.task)}</h3>
        <div class="sig">def ${esc(q.sig)}:</div>
        <div class="examples"><span class="label" style="font-family:var(--f-body)">Examples</span>${ex}</div></div>
      <div class="hints" id="hints"></div>
      <button class="btn btn-ghost btn-full" id="hint-btn"></button>
      <div id="result"></div>
    </div>
    <div class="ws">
      <div class="ws-head"><span>workspace.py</span><span class="eng ${skReady?"ready":""}" id="eng"><i></i> ${skReady?"Python ready":"loading Python…"}</span></div>
      <label for="editor" class="label" hidden>Code editor</label>
      <textarea id="editor" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Python code editor"></textarea>
      <div class="keys" id="keys">${["⇥ tab","()",":","[]","\"\"","=","==","+=","%","_","return ","for ","if "].map(k=>`<button type="button" data-k="${esc(k)}">${esc(k.trim())}</button>`).join("")}</div>
      <div class="ws-actions"><button class="btn btn-sun" id="run">Run tests</button><button class="btn btn-ghost btn-sm" id="reset-code">Reset code</button></div>
      <div class="console" id="console" aria-live="polite"></div>
    </div>
  </div>`;
  const ed=document.getElementById("editor");
  ed.value=q.starter;
  wireEditor(ed);
  document.getElementById("sv-quit").onclick=()=>{ saveP(); survivalLobby(); };
  document.getElementById("run").onclick=runTests;
  document.getElementById("reset-code").onclick=()=>{ ed.value=q.starter; ed.focus(); };
  document.getElementById("hint-btn").onclick=nextHint;
  drawHints();
  loadSkulpt().catch(()=>{ const e=document.getElementById("eng"); if(e) e.lastChild.textContent=" Python failed to load"; });
  window.scrollTo(0,0);
}
function wireEditor(ed){
  const insert=(txt,caretBack=0)=>{
    const s=ed.selectionStart, e=ed.selectionEnd;
    ed.setRangeText(txt,s,e,"end");
    if(caretBack){ const p=ed.selectionStart-caretBack; ed.setSelectionRange(p,p); }
    ed.focus();
  };
  ed.addEventListener("keydown",ev=>{
    if(ev.key==="Tab"){ ev.preventDefault(); insert("    "); }
    else if(ev.key==="Enter"){
      ev.preventDefault();
      const s=ed.selectionStart, lineStart=ed.value.lastIndexOf("\n",s-1)+1, line=ed.value.slice(lineStart,s);
      let ind=(line.match(/^ */)||[""])[0]; if(/:\s*$/.test(line)) ind+="    ";
      insert("\n"+ind);
    }
  });
  document.getElementById("keys").querySelectorAll("button").forEach(b=>{
    b.addEventListener("mousedown",e=>e.preventDefault());
    b.onclick=()=>{ const k=b.dataset.k;
      if(k==="⇥ tab") insert("    "); else if(k==="()"||k==="[]"||k==="\"\"") insert(k,1); else insert(k); };
  });
}
function drawHints(){
  const q=Q.q, h=document.getElementById("hints"), b=document.getElementById("hint-btn");
  h.innerHTML=q.hints.slice(0,Q.hints).map((t,i)=>`<div class="hint">${av(P.companion,i===Q.hints-1?"happy":"")}<div><b>Hint ${i+1} of ${q.hints.length}</b>${esc(t)}</div></div>`).join("")
    +(Q.revealed?`<div class="hint">${av(P.companion)}<div><b>Solution</b>Here's one way to write it. Read it line by line, then run it.<div class="mini"><pre>${hl(q.solution)}</pre></div></div></div>`:"");
  if(Q.solved){ b.hidden=true; return; }
  b.hidden=false;
  if(Q.hints<q.hints.length){ b.textContent=`Ask ${C().name} for a hint (${q.hints.length-Q.hints} left)`; b.disabled=false; }
  else if(!Q.revealed){ b.textContent="Show the solution (costs 1 energy)"; b.disabled=false; }
  else { b.hidden=true; }
}
function nextHint(){
  if(!Q) return;
  if(Q.hints<Q.q.hints.length){ Q.hints++; drawHints(); }
  else if(!Q.revealed){ Q.revealed=true; P.run.energy--; drawEnergy(); saveP(); drawHints();
    if(P.run.energy<=0) return setTimeout(runOver,300); }
  const hs=document.querySelectorAll(".hint"); if(hs.length) hs[hs.length-1].scrollIntoView({behavior:"smooth",block:"nearest"});
}
function drawEnergy(){ const e=document.getElementById("energy"); if(e){ e.innerHTML=[0,1,2,3,4].map(i=>ICON.energy(i<P.run.energy)).join(""); e.setAttribute("aria-label",P.run.energy+" energy"); } }
async function runTests(){
  if(!Q||Q.solved) return;
  const q=Q.q, con=document.getElementById("console"), btn=document.getElementById("run"), code=document.getElementById("editor").value;
  btn.disabled=true; con.innerHTML=`<span class="h">Running</span><pre>${skReady?"Running your code…":"Loading the Python engine (first run takes a few seconds)…"}</pre>`;
  try{ await loadSkulpt(); }catch(e){ con.innerHTML=`<span class="h">Engine</span><pre class="errbox">Couldn't load the Python engine. Check your connection and tap Run again.</pre>`; btn.disabled=false; return; }
  let out=""; Sk.configure({output:t=>{out+=t}, read:skRead, __future__:Sk.python3, execLimit:4000});
  let mod;
  try{ mod=await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,code,true)); }
  catch(e){ return codeError(fmtErr(e),out); }
  const fn=mod.$d[q.fn];
  if(!fn) return codeError(`NameError: there's no function called ${q.fn}. Check the spelling after def.`,out);
  const results=[];
  for(const [args,exp] of q.tests){
    let got, err=null;
    try{ Sk.execStart=new Date(); const r=await Sk.misceval.asyncToPromise(()=>Sk.misceval.callsimOrSuspendArray(fn,args.map(a=>Sk.ffi.remapToPy(JSON.parse(JSON.stringify(a)))))); got=Sk.ffi.remapToJs(r); }
    catch(e){ err=fmtErr(e); }
    results.push({args,exp,got,err,ok:!err&&canon(got)===canon(exp)});
  }
  btn.disabled=false;
  const passed=results.filter(r=>r.ok).length, allOk=passed===results.length;
  con.innerHTML=`${out?`<span class="h">Your code printed</span><pre>${esc(out.length>1200?out.slice(0,1200)+"\n…":out)}</pre>`:""}
   <span class="h">Tests · ${passed}/${results.length} passed</span>
   ${results.map(r=>`<div class="trow ${r.ok?"pass":"fail"}"><span class="m">${r.ok?"✓":"✗"}</span><span class="d">${esc(callStr(q,r.args))} → ${r.err?`<span class="errbox">${esc(r.err)}</span>`:esc(pyRepr(r.got))}${r.ok?"":`\n  expected ${esc(pyRepr(r.exp))}`}</span></div>`).join("")}`;
  if(allOk) questWon(); else questMiss(results);
}
function codeError(msg,out){
  const con=document.getElementById("console"); document.getElementById("run").disabled=false;
  con.innerHTML=`${out?`<span class="h">Your code printed</span><pre>${esc(out)}</pre>`:""}<span class="h">Error · no energy lost</span><pre class="errbox">${esc(msg)}</pre>`;
  document.getElementById("result").innerHTML=`<div class="lose" style="background:var(--sun-soft)"><h3 style="color:var(--ink)">The code didn't run</h3><p>${C().name}: ${esc(explainErr(msg))}</p></div>`;
}
function explainErr(m){
  if(/SyntaxError|ParseError/.test(m)) return "That's a syntax error, so Python couldn't read the code. Check colons after def/if/for, matching brackets and quotes, and the line number shown.";
  if(/IndentationError|indent/i.test(m)) return "The indentation is off. Lines inside a def, if or for need 4 more spaces than the line above them.";
  if(/NameError/.test(m)) return "Python found a name it doesn't know. Check spelling, and make sure a variable is created before you use it.";
  if(/TypeError/.test(m)) return "Two values of types that don't fit together, like adding a number to text. Look at the line shown.";
  if(/TimeLimit/.test(m)) return "The code ran too long. A while loop probably never ends. Make sure its condition becomes False.";
  return "Read the error message from the last line upward. The line number tells you where to look.";
}
function questMiss(results){
  P.run.energy--; drawEnergy(); saveP();
  const f=results.find(r=>!r.ok);
  const what=f.err?`it raised ${f.err.split(":")[0]}`:`it returned ${pyRepr(f.got)}`;
  const nudge=f.got===null&&!f.err?" A result of None usually means the function never reaches a return statement.":"";
  document.getElementById("result").innerHTML=`<div class="lose"><h3>Not yet · −1 energy</h3>
    <p>${C().name}: ${esc(pick(C().oops))} For <code>${esc(callStr(Q.q,f.args))}</code> ${esc(what)}, but the chamber expects <code>${esc(pyRepr(f.exp))}</code>.${esc(nudge)}${Q.hints<Q.q.hints.length?" Want a hint?":""}</p></div>`;
  if(P.run.energy<=0) setTimeout(runOver,900);
}
function questWon(){
  const q=Q.q; Q.solved=true;
  const gems=Q.revealed?0:Math.max(10,30-Q.hints*7);
  const firstClear=!P.solved[q.id];
  P.solved[q.id]={hints:Q.hints,revealed:Q.revealed||false};
  if(P.solved[q.id]&&!firstClear){} // keep latest attempt record
  P.run.gems+=gems; P.xp+=gems+(firstClear?10:0); P.run.depth++;
  P.survBest=Math.max(P.survBest,P.run.depth); bumpStreak();
  const finished=P.run.depth>=QUESTS.length;
  saveP(); drawHints();
  document.querySelector(".cave-speak .av").className="av happy";
  document.getElementById("result").innerHTML=`<div class="win">
    <div class="fb-head">${av(P.companion,"happy")}<div><h3>Chamber cleared!</h3><p class="says">${C().name}: ${esc(pick(C().cheer))}</p></div></div>
    <p><b>+${gems} gems</b>${firstClear?" · +10 XP first clear":""}${Q.hints?` · ${Q.hints} hint${Q.hints>1?"s":""} used`:" · no hints"}</p>
    <div class="logic"><span class="label">The logic</span><ol>${q.logic.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
    <div><span class="label">One clean solution</span><div class="mini" style="margin-top:6px"><pre>${hl(q.solution)}</pre></div></div>
    <button class="btn btn-ok btn-full" id="sv-next">${finished?"Claim the Source Stone":"Go deeper · chamber "+(P.run.depth+1)}</button></div>`;
  document.getElementById("sv-next").onclick=()=>finished?runVictory():openQuest();
  document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
}
function runOver(){
  const reached=P.run.depth, gems=P.run.gems; P.run=null; saveP();
  setWide(false,false);
  app.innerHTML=`<div class="result">${av(P.companion,"sad")}<span class="label">Survival mode</span><h2>Out of energy</h2>
    <p class="muted" style="max-width:36ch">${C().name}: We cleared ${reached} chamber${reached===1?"":"s"} this run. Every chamber you cleared stays on your progress page, and checkpoints unlock at chambers 4 and 7.</p>
    <div class="tiles"><div class="tile"><b>${reached}</b><span>cleared</span></div><div class="tile"><b>${gems}</b><span>gems</span></div><div class="tile"><b>${P.survBest}</b><span>best</span></div></div>
    <div class="btns"><button class="btn btn-sun btn-full" id="ro-again">Back to the ruins</button><button class="btn btn-ghost btn-full" id="ro-home">Home</button></div></div>`;
  document.getElementById("ro-again").onclick=survivalLobby; document.getElementById("ro-home").onclick=home;
  window.scrollTo(0,0);
}
function runVictory(){
  const gems=P.run.gems; P.run=null; P.xp+=50; saveP();
  setWide(false,false);
  app.innerHTML=`<div class="result">${av(P.companion,"happy")}<span class="label">Ruins of Recursion</span><h2>The Source Stone is yours</h2>
    <p class="muted" style="max-width:36ch">${C().name}: Ten chambers, all solved with your own code. That's loops, conditions, strings, lists and dictionaries, used for real. +50 XP bonus.</p>
    <div class="tiles"><div class="tile"><b>${QUESTS.length}</b><span>cleared</span></div><div class="tile"><b>${gems}</b><span>gems</span></div><div class="tile"><b>${level()}</b><span>level</span></div></div>
    <div class="btns"><button class="btn btn-sun btn-full" id="v-again">Run it again with fewer hints</button><button class="btn btn-ghost btn-full" id="v-home">Home</button></div></div>`;
  document.getElementById("v-again").onclick=survivalLobby; document.getElementById("v-home").onclick=home;
}

boot();
</script>
